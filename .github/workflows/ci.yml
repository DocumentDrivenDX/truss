name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC
  # pgserver-pg18 is published as GitHub release assets until it reaches PyPI.
  PIP_FIND_LINKS: https://github.com/DocumentDrivenDX/pgserver/releases/expanded_assets/pg18.6-pgv0.8.6-r2

jobs:
  build-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Core import-boundary lint (ADR-001)
        run: |
          python scripts/check-module-boundaries.py
          python scripts/check-module-boundaries-controls.py
      - name: Size guard
        run: bash scripts/size-guard.sh
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build packages/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  python:
    needs: build-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install built wheel
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query,experimental-pg8000]" pytest pytest-xdist
      - name: Python tests (fast subset)
        working-directory: packages/python/tests
        run: |
          "$RUNNER_TEMP/v/bin/python" -m pytest -q -n 4 -m "not slow" -p no:cacheprovider --durations=25 .

  smoke:
    needs: build-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fresh-venv install of the built wheel and local PostgreSQL start
        run: |
          python -m venv "$RUNNER_TEMP/q"
          "$RUNNER_TEMP/q/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/q/bin/python" - <<'PY'
          import psycopg, truss
          from truss import LocalPostgres
          with LocalPostgres("smoke-data") as pg:
              with psycopg.connect(pg.info.connection_uri) as c:
                  version = c.execute("SHOW server_version").fetchone()[0]
          assert version.startswith("18."), version
          print("ok", version)
          PY
