name: release

# Tag-driven. Pushing a tag `vX.Y.Z` tests, builds, smoke-tests and publishes `umf-truss` to PyPI
# (trusted publishing, environment `pypi`) and creates the GitHub Release.
# `workflow_dispatch` is a dry run: it builds and smoke-tests, and never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and smoke-test only. Publishing happens only for a pushed version tag.'
        type: boolean
        default: true

permissions:
  contents: read

env:
  TZ: UTC
  # pgserver-pg18 is published as GitHub release assets until it reaches PyPI.
  PIP_FIND_LINKS: https://github.com/DocumentDrivenDX/pgserver/releases/expanded_assets/pg18.6-pgv0.8.6-r2

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dispatch runs never publish
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "Publishing happens only for a pushed version tag; run this dispatch with dry_run=true." >&2
          exit 1
      - name: Tag must equal the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c 'import tomllib;print(tomllib.load(open("packages/python/pyproject.toml","rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}" >&2; exit 1; }
          python scripts/changelog_section.py "${version}" > /dev/null
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build packages/python --outdir dist
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: packages/python/examples
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Fresh-venv install of the built wheel and quickstart (no Bun, no source on the path)
        run: |
          python -m venv "$RUNNER_TEMP/q"
          "$RUNNER_TEMP/q/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query]"
          cp -r packages/python/examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/q/bin/python" examples/quickstart.py "$RUNNER_TEMP/demo" | tee out.json
          "$RUNNER_TEMP/q/bin/python" -c 'import json;d=json.load(open("out.json"));assert d["catalog"]=="accepted" and d["ack"]=="committed" and d["query"]=="relationship",d'

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/changelog_section.py "${version}" > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Truss ${version}" --notes-file notes.md --verify-tag
