name: Release Python package
on:
  workflow_dispatch:
    inputs:
      capacity_statistics:
        description: Collect test-only PostgreSQL completed-call statistics for capacity diagnosis
        type: boolean
        default: false
      public_workflows:
        description: Run the original installed 1000-node/1000-edge public workload on Linux
        type: boolean
        default: false
      stress_case:
        description: Run exact stress cases on Linux alongside native qualification
        type: choice
        default: none
        options: [none, all, small, nominal, type-heavy, many-types, wide, complex, dense-edges, index-heavy, skewed, node-heavy, large]
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.ref }}-${{ inputs.stress_case || 'publish' }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check large-workload runner capacity controls
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_large_runner_capacity_helper
      - name: Test frozen Weft wheel archive verification controls
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_verify_weft_release_wheel -v
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify reproducible embedded owner delivery assets
        run: |
          bun install --frozen-lockfile
          bun scripts/build-python-embedded.ts
          git diff --exit-code -- packages/python/src/truss/_embedded_js packages/python/src/truss/_embedded_release.py
      - name: Check version and build package
        run: |
          python - <<'PYTHON'
          import os,tomllib
          version=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version']
          if os.environ['GITHUB_REF_TYPE']=='tag':assert os.environ['GITHUB_REF_NAME']=='v'+version
          PYTHON
          python -m pip install build==1.3.0
          python -m build --outdir dist packages/python
      - name: Verify complete source payload in wheel and sdist
        run: |
          python - <<'PYTHON'
          import pathlib,tarfile,zipfile
          source=pathlib.Path('packages/python/src/truss')
          expected={p.relative_to(source).as_posix():p.read_bytes() for p in source.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'}
          with zipfile.ZipFile(next(pathlib.Path('dist').glob('*.whl'))) as wheel:
              actual={n.removeprefix('truss/'):wheel.read(n) for n in wheel.namelist() if n.startswith('truss/') and not n.endswith('/')}
              assert actual==expected, 'Wheel runtime payload differs from source'
          with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as sdist:
              actual={m.name.split('/src/truss/',1)[1]:sdist.extractfile(m).read() for m in sdist.getmembers() if m.isfile() and '/src/truss/' in m.name}
              assert actual==expected, 'Sdist runtime payload differs from source'
          print(f'Verified {len(expected)} exact source payloads in wheel and sdist')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
  native:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Install exact released compiler and verify its checksum
        run: |
          python - <<'PYTHON'
          import hashlib,pathlib,subprocess,sys,tomllib,urllib.request
          requirement=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['optional-dependencies']['query'][0]
          assert requirement.startswith('weft-sql==')
          version=requirement.removeprefix('weft-sql==')
          assert version and all(part.isdecimal() for part in version.split('.'))
          subprocess.run([sys.executable,'-m','pip','download','--only-binary=:all:','--no-deps','--no-index','--find-links',f'https://github.com/DocumentDrivenDX/weft/releases/expanded_assets/v{version}','--dest','/tmp/weft-wheels',requirement],check=True)
          root=pathlib.Path('/tmp/weft-wheels');wheels=list(root.glob('*.whl'));assert len(wheels)==1
          text=urllib.request.urlopen(f'https://github.com/DocumentDrivenDX/weft/releases/download/v{version}/SHA256SUMS',timeout=30).read().decode()
          entries={line.split()[1]:line.split()[0] for line in text.splitlines()}
          assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()==entries[wheels[0].name]
          PYTHON
          python scripts/verify-weft-release-wheel.py /tmp/weft-wheels/*.whl
          python -m pip install --no-deps /tmp/weft-wheels/*.whl
      - name: Install checksum-verified PG18 and this exact Truss wheel
        run: python scripts/install-local-runtime.py --wheelhouse /tmp/runtime-wheels --truss-wheel "$(find dist -name 'truss_toolkit-*.whl' -print -quit)"
      - name: Verify installed embedded owners with every subprocess forbidden
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_embedded_owner -v
      - name: Run combined typed-host and strict native result controls
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_group_result_wire test_group_result_wire_native test_action_transport -v
      - name: Run installed E1 group and admission regressions
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest -v test_group_runtime_bounds test_catalog_admission_outcomes test_group_preconditions_native.GroupPreconditionTests test_group_create_native.PublicCreateGroupTests test_key_lookup_native.KeyLookupTests test_object_read_native.PublicObjectReadTests test_object_pages_native.ObjectPageTests test_typed_query_pages_native.TypedQueryPagesTests test_typed_query_pages_native.StringQueryPagesTests test_read_only_public_native.ReadOnlyPublicTests
      - name: Verify source-only preparation, real schemas, and capacity regressions
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_embedder_schemas_native test_stress_registration_native test_catalog_view_capacity_native test_condition_precedence_native test_group_source_admission_native test_create_metadata_cache_native test_import_chunk_closure_native test_key_footprint_capacity_native test_endpoint_capacity_native test_history_projection_native test_schema_cache_native test_embedder_workflows_native test_bulk_update_transition_guard_native test_schema_memory_cache test_record_schema test_record_schema_oracle_native test_record_preparation_native test_record_schema_selection_native test_reader_catalog_native test_compiled_query_native.CompiledQueryTests.test_wide_complete_entity_preserves_fields_with_explicit_byte_budget
      - name: Run the installed public adopter workflow
        run: |
          python - <<'PYTHON'
          import importlib.metadata,pathlib,tomllib,truss,weft
          project=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']
          assert importlib.metadata.version('truss-toolkit')==project['version']
          expected_compiler=project['optional-dependencies']['query'][0].removeprefix('weft-sql==')
          assert importlib.metadata.version('weft-sql')==weft.__version__==expected_compiler
          assert not pathlib.Path(truss.__file__).resolve().is_relative_to(pathlib.Path('packages/python/src').resolve())
          PYTHON
          python packages/python/examples/adopter_workflow.py "$RUNNER_TEMP/truss-release-demo" --bun /missing/bun
      - name: Run installed original atomic capacity workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
          TRUSS_CAPACITY_FUNCTION_STATS: ${{ inputs.capacity_statistics && format('{0}/capacity-function-statistics', runner.temp) || '' }}
        run: python -m unittest test_group_capacity_native.GroupCapacityTests test_bulk_create_sql_native test_journal_batches_native

      - name: Run installed original public workload
        id: public_workflows
        if: github.ref_type == 'tag' || inputs.public_workflows || (github.event_name == 'workflow_dispatch' && inputs.stress_case != '' && inputs.stress_case != 'none')
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/public-workflows"
          python scripts/benchmark-public-workflows.py --truss-root "$GITHUB_WORKSPACE" --installed-package --count-sql-submissions --matrix-case small --bulk-size 1000 --read-samples 1000 --write-samples 200 --output "$RUNNER_TEMP/public-workflows/report.json" 2>&1 | tee "$RUNNER_TEMP/public-workflows/run.log"

      - name: Record original public workload status
        if: always() && (github.ref_type == 'tag' || inputs.public_workflows || (github.event_name == 'workflow_dispatch' && inputs.stress_case != '' && inputs.stress_case != 'none'))
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/public-workflows
          WORKLOAD_OUTCOME: ${{ steps.public_workflows.outcome }}
        run: |
          python - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path(os.environ['REPORT_DIRECTORY']);root.mkdir(parents=True,exist_ok=True)
          report=root/'report.json'
          status={'source':os.environ['GITHUB_SHA'],'outcome':os.environ['WORKLOAD_OUTCOME'],
              'reportPresent':report.is_file(),'scope':'Original small public workload; SQL 10s / operation 30s; no stress qualification'}
          if report.is_file():
              result=json.loads(report.read_bytes())
              status.update(functionalPassed=result['functionalPassed'],runtimePackage=result['runtimePackage'])
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PYTHON
      - name: Retain original public workload report and log
        if: always() && (github.ref_type == 'tag' || inputs.public_workflows || (github.event_name == 'workflow_dispatch' && inputs.stress_case != '' && inputs.stress_case != 'none'))
        uses: actions/upload-artifact@v4
        with:
          name: original-public-workflow-${{ matrix.os }}
          path: ${{ runner.temp }}/public-workflows/*
          if-no-files-found: error

      - name: Record capacity statistics collection status
        if: always() && inputs.capacity_statistics
        env:
          STATISTICS_DIRECTORY: ${{ runner.temp }}/capacity-function-statistics
        run: |
          python - <<'PYTHON'
          import json,os,pathlib,platform
          root=pathlib.Path(os.environ['STATISTICS_DIRECTORY']);root.mkdir(parents=True,exist_ok=True)
          records=[]
          for path in sorted(root.glob('*.json')):
              if path.name=='collection-status.json':continue
              record=json.loads(path.read_bytes())
              records.append({'file':path.name,'phase':record.get('phase','cumulative-after-close'),'status':record['status'],'reason':record.get('reason')})
          expected={'create','following','update','replay','late-fault'}
          status={'source':os.environ['GITHUB_SHA'],'platform':platform.system().lower()+'-'+platform.machine(),
              'scope':'Instrumented phase observations, not clean timing qualification; cancelled calls and later COMMIT work may be absent',
              'records':records,'missingPhases':sorted(expected-{r['phase'] for r in records})}
          (root/'collection-status.json').write_text(json.dumps(status,indent=2)+'\n')
          PYTHON
      - name: Retain capacity function statistics
        if: always() && inputs.capacity_statistics
        uses: actions/upload-artifact@v4
        with:
          name: capacity-function-statistics-${{ matrix.os }}
          path: ${{ runner.temp }}/capacity-function-statistics/*.json
          if-no-files-found: error

      - name: Run installed current-policy query and activation workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_current_query_runtime_native test_current_query_subject_cut_native -v
      - name: Run installed disclosure cohort and source correspondence regressions
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_DISCLOSURE_NATIVE_QUALIFICATION: '1'
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_current_disclosure_cohort test_current_disclosure_originals test_current_disclosure_runtime_native.CurrentDisclosureRuntimeNativeTests -v
      - name: Run the public-only policy query reference example
        run: python packages/python/examples/current_query_workflow.py "$RUNNER_TEMP/truss-policy-example" --bun /missing/bun
      - name: Register original UMF domain-pack catalogs through the installed API
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_domain_pack_catalog_native.DomainPackCatalogTests -v
      - name: Run installed owned graph and descendant query workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_feed_runtime_native.FeedRuntimeTests test_history_runtime_native.HistoryRuntimeTests test_owned_scope_native.OwnedScopeTests test_owned_objects_native.OwnedObjectTests test_owned_group_batch_native.OwnedGroupBatchTests test_journal_row_guard_native.JournalRowGuardTests test_prepared_plan_capture_native.PreparedPlanCaptureTests test_query_export_sources_native.QueryExportSourceTests test_rootless_preparation_native.RootlessPreparationTests test_operation_result_slots_native.OperationResultSlotTests test_edge_authority_native.EdgeAuthorityTests test_final_edge_inventory_native.FinalEdgeInventoryTests
      - name: Run installed owned catalog evolution and key backfill workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_catalog_key_backfill_native -v
      - name: Run installed numeric facet workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_numeric_facets_native.NumericFacetTests.test_public_accept_create_update_import_read_and_query test_numeric_facets_native.NumericFacet12_2Tests.test_public_accept_create_update_import_read_and_query
      - name: Run Hohfeld performance correctness and live-authority controls
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_runtime_release_cache test_query_compile_cache test_schema_cache_native test_hohfeld_statement_budgets_native test_compiled_query_native -v
      - name: Run installed unnamed-field and original registration retry workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_object_mutations_native.ObjectMutationTests.test_unnamed_fields_refuse_registration_with_element_diagnostics test_catalog_unchanged_native.CatalogUnchangedTests test_graph_commit_practical_native.GraphCommitPracticalTests test_atomic_group_surface_native.AtomicGroupSurfaceTests test_import_rejection_practical_native.ImportRejectionPracticalTests
      - name: Run basic current scalar and consumer workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_date_decimal_native.DateDecimalTests test_date_decimal_native.LargeScaleDecimalTests test_date_decimal_native.DateQueryTests test_consumer_northwind_numeric_native.ConsumerNorthwindNumericTests.test_original_product_exact_numeric_workflow test_consumer_northwind_numeric_native.UnnamedSqlTests.test_default_registration_refuses_missing_record_and_field_names test_object_mutations_native.ObjectMutationTests.test_writer_revoked_after_attempt_constraint_flush_still_aborts test_group_create_native.PublicCreateGroupTests.test_reader_and_asserted_actor_cannot_authorize_first_create
      - name: Run public offline preparation and unchanged commerce workflow
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_catalog_preparation_public test_core10_catalog_native test_commerce_source_native test_catalog_declarative test_catalog_declarative_native test_catalog_enforcement_native test_text_limit_evolution_native
      - name: Run installed current decimal scale2 workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_decimal_scale2_native.DecimalScale2Tests
      - name: Run public registration-owned rebinding workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_catalog_rebind_native test_required_catalog_rebind_native
      - name: Qualify remaining embedder batch catalog preview lifecycle and audit APIs
        env:
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_batched_import_native test_batched_import_parity_native test_catalog_additions_native test_catalog_continuation_native test_catalog_compatible_acceptance_native test_group_preview_native test_lifecycle_native test_install_preflight_native test_module_access_batch_native test_load_audit_native test_mutation_group_audit_native test_audit_disclosure_native test_owned_group_audit_native test_group_preview_wire test_load_audit_wire test_lifecycle_wire test_catalog_continuation_types test_ddd_owner_preparation -v
      - name: Run pending receipt visibility and bundled group preparation
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_receipt_visibility_native.ReceiptVisibilityTests
      - name: Verify managed-function statement budget and host fault containment
        env:
          PYTHONPATH: packages/python/tests
        run: |
          TRUSS_CENSUS_POSTGRES_BIN="$(python -c 'from pgserver._commands import POSTGRES_BIN_PATH; print(POSTGRES_BIN_PATH)')"
          test -x "$TRUSS_CENSUS_POSTGRES_BIN/initdb"
          test -x "$TRUSS_CENSUS_POSTGRES_BIN/pg_ctl"
          export TRUSS_CENSUS_POSTGRES_BIN
          PYTHONDONTWRITEBYTECODE=1 python -m unittest test_managed_function_guard test_managed_function_guard_native.ManagedFunctionGuardTests test_managed_function_guard_native.ManagedTableFunctionGuardTests test_managed_function_guard_native.CatalogTableFunctionGuardTests test_psycopg_host_native.PsycopgHostNativeTests
      - name: Run public recursive-container workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_recursive_containers_native
      - name: Run installed current exact timestamp workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_timestamp_query_native
      - name: Run installed current binary equality workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_binary_query_native.BinaryQueryTests
      - name: Run installed current optional binary workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_optional_binary_query_native.OptionalBinaryTests
      - name: Run installed current typed business-key workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_typed_keys_native.TypedKeyTests.test_public_typed_composite_workflow test_database_key_derivation_native.DatabaseKeyDerivationTests test_string_key_bucket_native.StringKeyBucketNativeTests
      - name: Run installed bounded traversal and module-owner workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_traversal_native.PublicTraversalTests
      - name: Run installed current numeric facet evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_facet_evolution_native.FacetEvolutionTests

      - name: Run installed current scalar container workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_scalar_containers_native.ScalarContainerTests

      - name: Run installed current typed relationship key workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_typed_relationship_keys_native

      - name: Run installed typed and string SQL page workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_typed_query_pages_native

      - name: Run installed field-name evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_field_name_evolution_native

      - name: Run installed Record rename and member-order workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_record_label_evolution_native

      - name: Run installed required-field evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_required_evolution_native

      - name: Run installed relationship-bound evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_relationship_evolution_native

      - name: Run installed flat-container requiredness workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_container_required_evolution_native

      - name: Run installed engine import and original diagnostic workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_replay_frame_native test_owned_import_native test_engine_import_native test_engine_action_session_native test_action_subject_installation_native test_catalog_diagnostics_native

      - name: Run installed parallel-edge workflow
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_parallel_edges_native

      - name: Run installed relationship-name evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_relationship_names_native

      - name: Run explicit named revisions of the three frozen real schemas
        if: github.event_name == 'workflow_dispatch' && inputs.stress_case == 'all' && matrix.os == 'ubuntu-24.04'
        env:
          PYTHONPATH: packages/python/tests
        run: |
          mkdir -p "$RUNNER_TEMP/real-schemas"
          python scripts/benchmark-public-workflows.py --truss-root "$GITHUB_WORKSPACE" --installed-package --author-fixture-names --forbid-external-javascript --capture-failure-diagnostics --count-sql-submissions --bulk-size 1000 --read-samples 1000 --write-samples 200 --output "$RUNNER_TEMP/real-schemas/report.json" 2>&1 | tee "$RUNNER_TEMP/real-schemas/run.log"
      - name: Retain original real-schema report and log
        if: always() && github.event_name == 'workflow_dispatch' && inputs.stress_case == 'all' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: original-real-schemas
          path: ${{ runner.temp }}/real-schemas/*
          if-no-files-found: warn

  large-capacity:
    if: "github.event_name == 'workflow_dispatch' && inputs.stress_case != '' && inputs.stress_case != 'none'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure available large-workload storage
        run: python scripts/prepare-large-stress-runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-runner-capacity-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/public-stress/runner-capacity.json
          if-no-files-found: error
  stress:
    needs:
      - "package"
      - "native"
    if: "github.event_name == 'workflow_dispatch' && inputs.stress_case != '' && inputs.stress_case != 'none'"
    strategy:
      fail-fast: false
      matrix:
        case: ${{ inputs.stress_case == 'all' && fromJSON('["large","dense-edges","wide","many-types","index-heavy","nominal","type-heavy","complex","skewed","node-heavy","small"]') || fromJSON(format('["{0}"]', inputs.stress_case)) }}
        os:
          - "ubuntu-24.04"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 360
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Prepare and verify storage for the exact large workload"
        if: "matrix.case == 'large'"
        run: "python scripts/prepare-large-stress-runner.py"
      - name: "Retain large-workload disk capacity before loading"
        if: "always() && matrix.case == 'large'"
        uses: "actions/upload-artifact@v4"
        with:
          name: "large-runner-capacity-${{ matrix.os }}"
          path: "${{ runner.temp }}/public-stress/runner-capacity.json"
          if-no-files-found: "warn"
      - uses: "actions/download-artifact@v4"
        with:
          name: "python-package"
          path: "dist"
      - name: "Install exact released compiler and verify its checksum"
        run: |
          python - <<'PYTHON'
          import hashlib,pathlib,subprocess,sys,tomllib,urllib.request
          requirement=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['optional-dependencies']['query'][0]
          assert requirement.startswith('weft-sql==')
          version=requirement.removeprefix('weft-sql==')
          assert version and all(part.isdecimal() for part in version.split('.'))
          subprocess.run([sys.executable,'-m','pip','download','--only-binary=:all:','--no-deps','--no-index','--find-links',f'https://github.com/DocumentDrivenDX/weft/releases/expanded_assets/v{version}','--dest','/tmp/weft-wheels',requirement],check=True)
          root=pathlib.Path('/tmp/weft-wheels');wheels=list(root.glob('*.whl'));assert len(wheels)==1
          text=urllib.request.urlopen(f'https://github.com/DocumentDrivenDX/weft/releases/download/v{version}/SHA256SUMS',timeout=30).read().decode()
          entries={line.split()[1]:line.split()[0] for line in text.splitlines()}
          assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()==entries[wheels[0].name]
          PYTHON
          python scripts/verify-weft-release-wheel.py /tmp/weft-wheels/*.whl
          python -m pip install --no-deps /tmp/weft-wheels/*.whl
      - name: "Install checksum-verified PG18 and this exact Truss wheel"
        run: "python scripts/install-local-runtime.py --wheelhouse /tmp/runtime-wheels --truss-wheel \"$(find dist -name 'truss_toolkit-*.whl' -print -quit)\""
      - name: "Run selected installed public stress workload"
        id: "stress"
        env:
          PYTHONPATH: "packages/python/tests"
          STRESS_CASE: "${{ matrix.case }}"
        shell: "bash"
        run: |
          mkdir -p "$RUNNER_TEMP/public-stress"
          load_size=100
          if [ "$STRESS_CASE" = large ]; then load_size=1000; fi
          python scripts/benchmark-public-workflows.py --truss-root "$GITHUB_WORKSPACE" --installed-package --forbid-external-javascript --capture-failure-diagnostics --count-sql-submissions --matrix-case "$STRESS_CASE" --bulk-size "$load_size" --read-samples 1000 --write-samples 200 --output "$RUNNER_TEMP/public-stress/report.json" 2>&1 | tee "$RUNNER_TEMP/public-stress/run.log"
      - name: "Record selected stress workload status"
        if: "always()"
        env:
          REPORT_DIRECTORY: "${{ runner.temp }}/public-stress"
          WORKLOAD_OUTCOME: "${{ steps.stress.outcome }}"
          STRESS_CASE: "${{ matrix.case }}"
        run: |
          python - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path(os.environ['REPORT_DIRECTORY']);root.mkdir(parents=True,exist_ok=True)
          report=root/'report.json'
          status={'source':os.environ['GITHUB_SHA'],'case':os.environ['STRESS_CASE'],'outcome':os.environ['WORKLOAD_OUTCOME'],
              'reportPresent':report.is_file(),'loadBatchSize':1000 if os.environ['STRESS_CASE']=='large' else 100,'statementTimeoutMs':10000,'operationTimeoutMs':30000,
              'scope':'Selected exact declared stress case; timeout or missing report is incomplete evidence'}
          capacity=root/'runner-capacity.json'
          status['runnerCapacityPresent']=capacity.is_file()
          if capacity.is_file():
              capacity_result=json.loads(capacity.read_bytes())
              status['runnerCapacity']=capacity_result
              status['capacityRefusal']=capacity_result.get('status')!='ready'
              if status['capacityRefusal'] and os.environ['STRESS_CASE']=='large':
                  status['performanceQualification']='incomplete'
          if report.is_file():
              result=json.loads(report.read_bytes())
              status.update(functionalPassed=result['functionalPassed'],runtimePackage=result['runtimePackage'])
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PYTHON
      - name: "Retain selected stress workload report and log"
        if: "always()"
        uses: "actions/upload-artifact@v4"
        with:
          name: "public-stress-${{ matrix.case }}-${{ matrix.os }}"
          path: "${{ runner.temp }}/public-stress/*"
          if-no-files-found: "error"
  publish:
    if: github.ref_type == 'tag'
    needs: [package, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Record exact assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          python - <<'PYTHON'
          import ast,hashlib,json,os,pathlib,tomllib
          project=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']
          backend=next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('packages/python/src/truss/_query_runtime.py').read_text()).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='BACKEND' for t in n.targets))
          root=pathlib.Path('dist');assets=sorted(root.iterdir());assert len(assets)==2
          assert len(list(root.glob('*.whl')))==len(list(root.glob('*.tar.gz')))==1
          for name in ('catalog-registration-summary-v0.1.md',):
              (root/name).write_bytes(pathlib.Path('docs/helix/02-design/contracts',name).read_bytes())
          (root/'catalog-rebind-report-v0.2.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.2.md').read_bytes())
          (root/'catalog-rebind-report-v0.4.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.4.md').read_bytes())
          (root/'catalog-source-reference-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-source-reference-v0.1.md').read_bytes())
          manifest=pathlib.Path('packages/python/src/truss/_catalog_runtime/manifest.json');runtime=json.loads(manifest.read_bytes())
          pins={'tag':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'distribution':'truss-toolkit','version':project['version'],'runtime':runtime['releaseId'],'runtimeManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'layout':runtime['layoutProfile'],'weftRelease':'v'+project['optional-dependencies']['query'][0].removeprefix('weft-sql=='),'weftBackend':backend['backendVersion'],'pgserver':'pgserver-pg18==18.6.1','pgserverRelease':'pg18.6-pgv0.8.6-r2','psycopg':'3.3.6','deploymentJavaScript':'embedded-v8','embeddedEngine':'mini-racer==0.14.1','externalJavaScriptRuntimeRequired':False,'nativePlatforms':['linux-x86_64']}
          profile=pathlib.Path('packages/python/src/truss/_profiles/fresh-catalog-support-current010.json')
          policy=json.loads(profile.read_bytes())
          pins.update(catalogRegistrationReportInterface='truss-catalog-registration-report/0.6',catalogPreparationInterface='truss-registration-preparation/2.0',catalogAcceptanceInputInterface='truss-acceptance-input/0.2.0',catalogViewInterface='truss-catalog-view/0.2.0',mandatoryPreparationTranscript=False,supportedUmfVersions=['0.10.0'],installationUpgradesSupported=False)
          pins.update(timestampComparisonProfile='umf-rfc3339-exact-instant/1.0.0',umfExactInstantCommit='cbb6fb87',umf010CatalogSupport={'identity':policy['identity'],'version':policy['version'],'sha256':hashlib.sha256(profile.read_bytes()).hexdigest()},umf010CatalogReportInterface='truss-catalog-registration-report/0.2',catalogSourceReferenceFormat='truss-catalog-source-reference/0.1',catalogRebindReportInterface='truss-catalog-registration-report/0.3',catalogRebindProfile='truss-native-catalog-rebind/0.4',catalogRebindSupportedProfiles=['truss-native-catalog-rebind/0.1','truss-native-catalog-rebind/0.2','truss-native-catalog-rebind/0.3','truss-native-catalog-rebind/0.4'])
          (root/'catalog-key-backfill-report-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-key-backfill-report-v0.1.md').read_bytes())
          pins.update(catalogKeyBackfillReportInterface='truss-catalog-registration-report/0.4',catalogKeyBackfillProfile='truss-catalog-key-backfill/0.2',catalogKeyBackfillSupportedProfiles=['truss-catalog-key-backfill/0.1','truss-catalog-key-backfill/0.2'])
          compiler_source=next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('scripts/build-weft-runtime-python.py').read_text()).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='REVISION' for t in n.targets))
          pins.update(currentQueryProfile='truss-current-query-protection/0.1-candidate',currentQueryResultAbi='weft.postgresql.current-values/0.2-candidate',currentQueryMode='explicitly-activated-read-only',currentQueryPlatforms=['linux-x86_64'],currentQueryWeftSource=compiler_source)
          group_profiles=json.loads(pathlib.Path('packages/python/src/truss/_catalog_runtime/group-profiles.json').read_bytes())['profiles']
          query_abi_bytes=pathlib.Path('packages/python/src/truss/_catalog_runtime/query-abi.json').read_bytes()
          query_abi=json.loads(query_abi_bytes)
          (root/'logical-query-abi.json').write_bytes(query_abi_bytes)
          pins.update(mutationProfile=next(p['pin'] for p in group_profiles if p['name']=='mutationProfile'),valueProfile=next(p['pin'] for p in group_profiles if p['name']=='valueProfile'),objectReadProfiles=['truss-python-scalar-object/0.4','truss-python-logical-object/0.1'],logicalQueryAbi={'identity':query_abi['identity'],'version':query_abi['version'],'sha256':hashlib.sha256(query_abi_bytes).hexdigest()})
          pins.update(compiledQueryCapability=next(p['pin'] for p in json.loads(pathlib.Path('packages/python/src/truss/_catalog_runtime/capability-profiles.json').read_bytes())['profiles'] if p['name']=='weft_execution'))
          summary=pathlib.Path('docs/helix/02-design/contracts/catalog-registration-summary-v0.1.md')
          if summary.exists():
              (root/summary.name).write_bytes(summary.read_bytes())
              pins.update(catalogRegistrationReportInterface='truss-catalog-registration-report/0.6',umf010CatalogReportInterface='truss-catalog-registration-report/0.6',catalogRebindReportInterface='truss-catalog-registration-report/0.6',catalogKeyBackfillReportInterface='truss-catalog-registration-report/0.6',catalogRegistrationSourceFormat='truss-registration-summary/2.0',catalogPreparationSummaryInterface='truss-registration-preparation/2.0')
          (root/'release-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          assets=sorted(root.iterdir())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PYTHON
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Truss ${GITHUB_REF_NAME}" --notes-file "docs/helix/04-build/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
