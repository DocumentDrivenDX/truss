name: Release Python package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version and build package
        run: |
          python - <<'PYTHON'
          import os,tomllib
          version=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version']
          if os.environ['GITHUB_REF_TYPE']=='tag':assert os.environ['GITHUB_REF_NAME']=='v'+version
          PYTHON
          python -m pip install build==1.3.0
          python -m build --outdir dist packages/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
  native:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Install exact released compiler and verify its checksum
        run: |
          python - <<'PYTHON'
          import hashlib,pathlib,subprocess,sys,tomllib,urllib.request
          requirement=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['optional-dependencies']['query'][0]
          assert requirement.startswith('weft-sql==')
          version=requirement.removeprefix('weft-sql==')
          assert version and all(part.isdecimal() for part in version.split('.'))
          subprocess.run([sys.executable,'-m','pip','download','--only-binary=:all:','--no-deps','--no-index','--find-links',f'https://github.com/DocumentDrivenDX/weft/releases/expanded_assets/v{version}','--dest','/tmp/weft-wheels',requirement],check=True)
          root=pathlib.Path('/tmp/weft-wheels');wheels=list(root.glob('*.whl'));assert len(wheels)==1
          text=urllib.request.urlopen(f'https://github.com/DocumentDrivenDX/weft/releases/download/v{version}/SHA256SUMS',timeout=30).read().decode()
          entries={line.split()[1]:line.split()[0] for line in text.splitlines()}
          assert hashlib.sha256(wheels[0].read_bytes()).hexdigest()==entries[wheels[0].name]
          PYTHON
          python -m pip install --no-deps /tmp/weft-wheels/*.whl
      - name: Install checksum-verified PG18 and this exact Truss wheel
        run: python scripts/install-local-runtime.py --wheelhouse /tmp/runtime-wheels --truss-wheel "$(find dist -name 'truss_toolkit-*.whl' -print -quit)"
      - name: Run the installed public adopter workflow
        run: |
          python - <<'PYTHON'
          import importlib.metadata,pathlib,tomllib,truss,weft
          project=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']
          assert importlib.metadata.version('truss-toolkit')==project['version']
          expected_compiler=project['optional-dependencies']['query'][0].removeprefix('weft-sql==')
          assert importlib.metadata.version('weft-sql')==weft.__version__==expected_compiler
          assert not pathlib.Path(truss.__file__).resolve().is_relative_to(pathlib.Path('packages/python/src').resolve())
          PYTHON
          python packages/python/examples/adopter_workflow.py "$RUNNER_TEMP/truss-release-demo" --bun bun
      - name: Run installed current-policy query and activation workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_current_query_runtime_native -v
      - name: Run the public-only policy query reference example
        run: python packages/python/examples/current_query_workflow.py "$RUNNER_TEMP/truss-policy-example" --bun bun
      - name: Run installed owned graph and descendant query workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_owned_objects_native.OwnedObjectTests test_owned_group_batch_native.OwnedGroupBatchTests test_journal_row_guard_native.JournalRowGuardTests test_prepared_plan_capture_native.PreparedPlanCaptureTests test_group_capacity_native.GroupCapacityTests test_rootless_preparation_native.RootlessPreparationTests test_operation_result_slots_native.OperationResultSlotTests test_edge_authority_native.EdgeAuthorityTests test_final_edge_inventory_native.FinalEdgeInventoryTests
      - name: Upgrade the published native68 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: |
          gh release download v0.0.35 --repo DocumentDrivenDX/truss --pattern truss_toolkit-0.0.35-py3-none-any.whl --pattern SHA256SUMS --dir "$RUNNER_TEMP/truss-068-source"
          python - <<'PYCODE'
          import os,pathlib,hashlib,json,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'truss-068-source'
          name='truss_toolkit-0.0.35-py3-none-any.whl'
          expected=dict((line.split()[1],line.split()[0]) for line in (root/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected[name]
          with zipfile.ZipFile(root/name) as wheel:
              manifest=wheel.read('truss/_catalog_runtime/manifest.json')
          assert hashlib.sha256(manifest).hexdigest()=='3588cf030cb46c7d12368557e351bd767c10b4dd2e1644f7f100cec54602a2fc'
          assert json.loads(manifest)['releaseId']=='truss-catalog-runtime/0.68-candidate'
          PYCODE
          python -m pip install --no-deps --target "$RUNNER_TEMP/truss-068-package" "$RUNNER_TEMP/truss-068-source/truss_toolkit-0.0.35-py3-none-any.whl"
          TRUSS_DB_KEY_PREDECESSOR="$RUNNER_TEMP/truss-068-package" python -m unittest test_database_key_upgrade_native
      - name: Run installed numeric facet workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_numeric_facets_native.NumericFacetTests.test_public_accept_create_update_import_read_and_query test_numeric_facets_native.NumericFacet08Tests.test_public_accept_create_update_import_read_and_query test_numeric_facets_native.NumericFacet12_2Tests.test_public_accept_create_update_import_read_and_query
      - name: Run installed unnamed-field and original registration retry workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_object_mutations_native.ObjectMutationTests.test_unnamed_fields_register_create_update_and_reopen test_catalog_unchanged_native.CatalogUnchangedTests test_graph_commit_practical_native.GraphCommitPracticalTests test_atomic_group_surface_native.AtomicGroupSurfaceTests test_import_rejection_practical_native.ImportRejectionPracticalTests
      - name: Run basic current scalar and consumer workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_date_decimal_native.DateDecimalTests test_date_decimal_native.LargeScaleDecimalTests test_consumer_northwind_numeric_native.ConsumerNorthwindNumericTests.test_original_product_exact_numeric_workflow test_consumer_northwind_numeric_native.UnnamedSqlTests.test_default_compiler_uses_stable_ids_without_authored_names test_object_mutations_native.ObjectMutationTests.test_writer_revoked_after_attempt_constraint_flush_still_aborts test_group_create_native.PublicCreateGroupTests.test_reader_and_asserted_actor_cannot_authorize_first_create
      - name: Run public offline preparation and unchanged commerce workflow
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_catalog_preparation_public test_commerce_source_native test_catalog_declarative test_catalog_declarative_native
      - name: Run both installed decimal scale2 workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_decimal_scale2_native.DecimalScale2Tests test_decimal_scale2_native.DecimalScale208Tests
      - name: Run public registration-owned rebinding workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_catalog_rebind_native test_required_catalog_rebind_native
      - name: Run public recursive-container workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_recursive_containers_native
      - name: Upgrade the published native63 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.0.27 --repo DocumentDrivenDX/truss --pattern truss_toolkit-0.0.27-py3-none-any.whl --pattern SHA256SUMS --dir "$RUNNER_TEMP/truss-063-source"
          python - <<'PYCODE'
          import os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'truss-063-source'
          name='truss_toolkit-0.0.27-py3-none-any.whl'
          expected=dict((line.split()[1],line.split()[0]) for line in (root/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected[name]
          PYCODE
          python -m pip install --no-deps --target "$RUNNER_TEMP/truss-063-package" "$RUNNER_TEMP/truss-063-source/truss_toolkit-0.0.27-py3-none-any.whl"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests TRUSS_RECURSIVE_UPGRADE_SOURCE_PACKAGE="$RUNNER_TEMP/truss-063-package" python -m unittest test_recursive_upgrade_native
      - name: Verify populated published35 to hotfix36 to owned upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSS_BUN_EXECUTABLE: bun
        run: |
          gh release download v0.0.35 --repo DocumentDrivenDX/truss --pattern truss_toolkit-0.0.35-py3-none-any.whl --pattern SHA256SUMS --dir "$RUNNER_TEMP/truss-hotfix-source"
          python - <<'PYCODE'
          import os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'truss-hotfix-source'
          name='truss_toolkit-0.0.35-py3-none-any.whl'
          expected=dict((line.split()[1],line.split()[0]) for line in (root/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected[name]
          PYCODE
          python -m pip install --no-deps --target "$RUNNER_TEMP/truss-hotfix-package" "$RUNNER_TEMP/truss-hotfix-source/truss_toolkit-0.0.35-py3-none-any.whl"
          gh release download v0.0.37 --repo DocumentDrivenDX/truss --pattern truss_toolkit-0.0.37-py3-none-any.whl --pattern SHA256SUMS --dir "$RUNNER_TEMP/truss-070-source"
          python - <<'PYCODE'
          import os,pathlib,hashlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'truss-070-source'
          name='truss_toolkit-0.0.37-py3-none-any.whl'
          expected=dict((line.split()[1],line.split()[0]) for line in (root/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected[name]
          with zipfile.ZipFile(root/name) as wheel:
              original=wheel.read('truss/_catalog_runtime/manifest.json')
          assert original==pathlib.Path('packages/python/src/truss/_catalog_runtime/upgrade-source-070.json').read_bytes()
          PYCODE
          python -m pip install --no-deps --target "$RUNNER_TEMP/truss-070-package" "$RUNNER_TEMP/truss-070-source/truss_toolkit-0.0.37-py3-none-any.whl"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests TRUSS_EDGE_HOTFIX_SOURCE_PACKAGE="$RUNNER_TEMP/truss-hotfix-package" TRUSS_EDGE_HOTFIX_INTERMEDIATE_PACKAGE="$RUNNER_TEMP/truss-070-package" python -m unittest test_edge_writer_hotfix_native
      - name: Run both installed exact timestamp workflows
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/python/tests python -m unittest test_timestamp_query_native
      - name: Run both installed binary equality workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_binary_query_native.BinaryQueryTests test_binary_query_native.BinaryQuery08Tests
      - name: Run both installed optional binary workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_optional_binary_query_native.OptionalBinaryTests test_optional_binary_query_native.OptionalBinary08Tests
      - name: Run both installed typed business-key workflows
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: python -m unittest test_typed_keys_native.TypedKeyTests.test_public_typed_composite_workflow test_typed_keys_native.TypedKey08Tests.test_public_typed_composite_workflow test_database_key_derivation_native.DatabaseKeyDerivationTests
      - name: Upgrade native65 without rewriting stored keys
        env:
          TRUSS_BUN_EXECUTABLE: bun
          PYTHONPATH: packages/python/tests
        run: |
          mkdir -p "$RUNNER_TEMP/truss-native65"
          git archive a150b189206d785bf795fbcbcdcbcc53cfda2639 packages/python/src/truss | tar -x -C "$RUNNER_TEMP/truss-native65"
          TRUSS_DB_KEY_PREDECESSOR="$RUNNER_TEMP/truss-native65/packages/python/src" python -m unittest test_database_key_upgrade_native
          mkdir -p "$RUNNER_TEMP/truss-native66"
          git archive c656f35d packages/python/src/truss | tar -x -C "$RUNNER_TEMP/truss-native66"
          TRUSS_DB_KEY_PREDECESSOR="$RUNNER_TEMP/truss-native66/packages/python/src" python -m unittest test_database_key_upgrade_native
      - name: Run installed bounded traversal and module-owner workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_traversal_native.PublicTraversalTests
      - name: Run both installed numeric facet evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_facet_evolution_native.FacetEvolutionTests test_facet_evolution_native.FacetEvolution08Tests

      - name: Run both installed scalar container workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_scalar_containers_native.ScalarContainerTests test_scalar_containers_native.ScalarContainer08Tests

      - name: Run both installed typed relationship key workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_typed_relationship_keys_native

      - name: Run installed typed and string SQL page workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_typed_query_pages_native

      - name: Run installed field-name evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_field_name_evolution_native

      - name: Run installed Record rename and member-order workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_record_label_evolution_native

      - name: Run installed required-field evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_required_evolution_native

      - name: Run installed relationship-bound evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_relationship_evolution_native

      - name: Run installed flat-container requiredness workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_container_required_evolution_native

      - name: Run installed engine import and original diagnostic workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_engine_import_native test_catalog_diagnostics_native

      - name: Run installed parallel-edge workflow
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_parallel_edges_native

      - name: Run installed relationship-name evolution workflows
        env:
          PYTHONPATH: packages/python/tests
          TRUSS_BUN_EXECUTABLE: bun
        run: python -m unittest test_relationship_names_native

  publish:
    if: github.ref_type == 'tag'
    needs: [package, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Record exact assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          python - <<'PYTHON'
          import ast,hashlib,json,os,pathlib,tomllib
          project=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']
          backend=next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('packages/python/src/truss/_query_runtime.py').read_text()).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='BACKEND' for t in n.targets))
          root=pathlib.Path('dist');assets=sorted(root.iterdir());assert len(assets)==2
          assert len(list(root.glob('*.whl')))==len(list(root.glob('*.tar.gz')))==1
          (root/'catalog-rebind-report-v0.2.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.2.md').read_bytes())
          (root/'catalog-rebind-report-v0.4.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.4.md').read_bytes())
          (root/'catalog-source-reference-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-source-reference-v0.1.md').read_bytes())
          manifest=pathlib.Path('packages/python/src/truss/_catalog_runtime/manifest.json');runtime=json.loads(manifest.read_bytes())
          pins={'tag':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'distribution':'truss-toolkit','version':project['version'],'runtime':runtime['releaseId'],'runtimeManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'layout':runtime['layoutProfile'],'weftRelease':'v'+project['optional-dependencies']['query'][0].removeprefix('weft-sql=='),'weftBackend':backend['backendVersion'],'pgserver':'pgserver-pg18==18.6.1','pgserverRelease':'pg18.6-pgv0.8.6-r2','psycopg':'3.3.6','bun':'1.4.2','nativePlatforms':['linux-x86_64','macos-arm64']}
          profile=pathlib.Path('packages/python/src/truss/_profiles/fresh-catalog-support-date08.json')
          policy=json.loads(profile.read_bytes())
          pins.update(timestampComparisonProfile='umf-rfc3339-exact-instant/1.0.0',umfExactInstantCommit='cbb6fb87',umf08CatalogSupport={'identity':policy['identity'],'version':policy['version'],'sha256':hashlib.sha256(profile.read_bytes()).hexdigest()},umf08CatalogReportInterface='truss-catalog-registration-report/0.2',catalogSourceReferenceFormat='truss-catalog-source-reference/0.1',catalogRebindReportInterface='truss-catalog-registration-report/0.3',catalogRebindProfile='truss-native-catalog-rebind/0.4',catalogRebindSupportedProfiles=['truss-native-catalog-rebind/0.1','truss-native-catalog-rebind/0.2','truss-native-catalog-rebind/0.3','truss-native-catalog-rebind/0.4'])
          (root/'catalog-key-backfill-report-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-key-backfill-report-v0.1.md').read_bytes())
          pins.update(catalogKeyBackfillReportInterface='truss-catalog-registration-report/0.4',catalogKeyBackfillProfile='truss-catalog-key-backfill/0.2',catalogKeyBackfillSupportedProfiles=['truss-catalog-key-backfill/0.1','truss-catalog-key-backfill/0.2'])
          compiler_source=next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('scripts/build-weft-runtime-python.py').read_text()).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='REVISION' for t in n.targets))
          pins.update(currentQueryProfile='truss-current-query-protection/0.1-candidate',currentQueryResultAbi='weft.postgresql.current-values/0.2-candidate',currentQueryMode='explicitly-activated-read-only',currentQueryPlatforms=['linux-x86_64','macos-arm64'],currentQueryWeftSource=compiler_source)
          group_profiles=json.loads(pathlib.Path('packages/python/src/truss/_catalog_runtime/group-profiles.json').read_bytes())['profiles']
          query_abi_bytes=pathlib.Path('packages/python/src/truss/_catalog_runtime/query-abi.json').read_bytes()
          query_abi=json.loads(query_abi_bytes)
          (root/'logical-query-abi.json').write_bytes(query_abi_bytes)
          pins.update(mutationProfile=next(p['pin'] for p in group_profiles if p['name']=='mutationProfile'),valueProfile=next(p['pin'] for p in group_profiles if p['name']=='valueProfile'),objectReadProfiles=['truss-python-scalar-object/0.4','truss-python-logical-object/0.1'],logicalQueryAbi={'identity':query_abi['identity'],'version':query_abi['version'],'sha256':hashlib.sha256(query_abi_bytes).hexdigest()})
          pins.update(compiledQueryCapability=next(p['pin'] for p in json.loads(pathlib.Path('packages/python/src/truss/_catalog_runtime/capability-profiles.json').read_bytes())['profiles'] if p['name']=='weft_execution'))
          summary=pathlib.Path('docs/helix/02-design/contracts/catalog-registration-summary-v0.1.md')
          if summary.exists():
              (root/summary.name).write_bytes(summary.read_bytes())
              pins.update(catalogRegistrationReportInterface='truss-catalog-registration-report/0.5',umf08CatalogReportInterface='truss-catalog-registration-report/0.5',catalogRebindReportInterface='truss-catalog-registration-report/0.5',catalogKeyBackfillReportInterface='truss-catalog-registration-report/0.5',catalogRegistrationSourceFormat='truss-registration-summary/1.0',catalogPreparationSummaryInterface='truss-registration-preparation/1.0')
          (root/'release-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          assets=sorted(root.iterdir())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PYTHON
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Truss ${GITHUB_REF_NAME}" --notes-file "docs/helix/04-build/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
