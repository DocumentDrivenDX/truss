name: nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  PIP_FIND_LINKS: https://github.com/DocumentDrivenDX/pgserver/releases/expanded_assets/pg18.6-pgv0.8.6-r2

jobs:
  slow-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          python -m pip install build==1.3.0
          python -m build packages/python --outdir dist
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query,experimental-pg8000]" pytest pytest-xdist
      - name: Python tests (slow subset)
        working-directory: packages/python/tests
        run: |
          "$RUNNER_TEMP/v/bin/python" -m pytest -q -n 4 -m "slow and not quarantined" -p no:cacheprovider --durations=25 .

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel, install, run the independent HF corpus against it
        run: |
          python -m pip install build==1.3.0
          python -m build packages/python --outdir dist
          python scripts/build-hf-conformance-archive.py --output "$RUNNER_TEMP/hf.zip"
          mkdir "$RUNNER_TEMP/hf" && unzip -q "$RUNNER_TEMP/hf.zip" -d "$RUNNER_TEMP/hf"
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query]"
          cd "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/v/bin/python" scripts/run-hf-conformance.py --installed-package

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install build==1.3.0
          python -m build packages/python --outdir dist
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls "$PWD"/dist/*.whl)[local,native,query]"
          "$RUNNER_TEMP/v/bin/python" scripts/test-runtime-migrations.py --installed-package
