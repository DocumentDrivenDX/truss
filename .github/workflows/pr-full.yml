# Heavy suite on PRs is opt-in; everything else is proven by evidence.
#
# On a PR, `full` runs only with the `ci:full` label. Otherwise the cheap
# `evidence-gate` job (seconds, bash/git/jq) passes when ANY of:
#   (a) .ci/evidence/full-suite.json matches this PR head's content hash --
#       run `scripts/verify-full.sh` locally on the final commit, then commit
#       the evidence file as the LAST commit (any later edit invalidates it);
#   (b) the PR has label `ci:full` and the heavy suite below passed;
#   (c) the diff touches no path the heavy suite covers (see HEAVY_RE).
# Release, tag and publish workflows ignore evidence and always run the suite.
name: PR full suite
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  # Unrelated label churn must not cancel a running heavy suite.
  group: pr-full-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'labeled' && github.event.label.name != 'ci:full') || github.event.action == 'unlabeled') && 'meta' || 'run' }}
  cancel-in-progress: true
jobs:
  temporal-selector-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      temporal_selected: ${{ steps.selector.outputs.temporal_selected }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require explicit retained proof selectors for the temporal candidate source
        id: selector
        env:
          TN_PR_NUMBER: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_PR_NUMBER }}
          TN_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          TN_RUN_ID: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_RUN_ID }}
          TN_ARTIFACT_ID: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_ARTIFACT_ID }}
          TN_ARTIFACT_SHA256: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_ARTIFACT_SHA256 }}
        run: |
          python - <<'PYCODE'
          import json,os,pathlib,sys
          sys.path.insert(0,'scripts')
          from temporal_qualified_artifact import validate_pr_source_selector
          manifest=json.loads(pathlib.Path('packages/python/src/truss/_catalog_runtime/manifest.json').read_bytes())
          selected=validate_pr_source_selector(release_id=manifest.get('releaseId'),
            current_pr_number=os.environ['TN_EVENT_PR_NUMBER'],selected_pr_number=os.environ['TN_PR_NUMBER'],
            run_id=os.environ['TN_RUN_ID'],artifact_id=os.environ['TN_ARTIFACT_ID'],
            artifact_sha256=os.environ['TN_ARTIFACT_SHA256'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('temporal_selected='+str(selected).lower()+'\n')
          PYCODE
  full:
    needs: [temporal-selector-guard]
    if: contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    uses: ./.github/workflows/python-runtime.yml
    permissions:
      actions: read
      contents: read
    with:
      # The tested guard output selects the retained-proof consumer only for
      # its target PR; unrelated PRs keep ordinary released-runtime smoke.
      released_runtime_probe: ${{ needs.temporal-selector-guard.outputs.temporal_selected != 'true' }}
      temporal_candidate_probe: ${{ needs.temporal-selector-guard.outputs.temporal_selected == 'true' }}
      temporal_candidate_phase: qualify119
      temporal_candidate_source_commit: ${{ github.event.pull_request.head.sha }}
      temporal_qualification_pr_number: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_PR_NUMBER }}
      temporal_qualification_run_id: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_RUN_ID }}
      temporal_qualification_artifact_id: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_ARTIFACT_ID }}
      temporal_qualification_artifact_sha256: ${{ vars.TRUSS_TEMPORAL_QUALIFICATION_ARTIFACT_SHA256 }}

  # Cheap gate (seconds): proves the heavy suite was run for this exact tree.
  evidence-gate:
    name: evidence-gate
    if: always() && github.event_name == 'pull_request'
    needs: [full, temporal-selector-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check evidence
        env:
          FULL_RESULT: ${{ needs.full.result }}
          GUARD_RESULT: ${{ needs.temporal-selector-guard.result }}
          TEMPORAL_SELECTED: ${{ needs.temporal-selector-guard.outputs.temporal_selected }}
          BASE_REF: ${{ github.base_ref }}
          HEAVY_RE: '^(packages|scripts|tests|tools)/|^(package\.json|bun\.lock)$'
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os,sys
          sys.path.insert(0,'scripts')
          from temporal_qualified_artifact import validate_pr_evidence_gate
          validate_pr_evidence_gate(guard_result=os.environ['GUARD_RESULT'],
            temporal_selected=os.environ['TEMPORAL_SELECTED'],full_result=os.environ['FULL_RESULT'])
          PYCODE
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Ev '^(scripts/verify-full\.sh|\.ci/evidence/)' || true)
          if ! grep -Eq "$HEAVY_RE" <<<"$changed"; then
            echo "No heavy-suite paths changed; gate passes."; exit 0
          fi
          if [[ "$FULL_RESULT" == "success" ]]; then
            echo "ci:full label set and heavy suite passed; gate passes."; exit 0
          fi
          f=.ci/evidence/full-suite.json
          if [[ -f "$f" ]]; then
            want=$(jq -r .content_hash "$f")
            have=$(bash scripts/verify-full.sh --hash-only)
            if [[ "$want" == "$have" ]]; then
              echo "Evidence matches ($(jq -r '.suite + " @ " + .timestamp' "$f")); gate passes."; exit 0
            fi
            echo "::error::Evidence is stale (recorded $want, tree is $have). Re-run scripts/verify-full.sh and commit."
          else
            echo "::error::No $f. Run scripts/verify-full.sh and commit the evidence, or add the 'ci:full' label."
          fi
          exit 1
