name: PyPI publisher validation
on:
  pull_request:
    paths: ['scripts/**publish_pypi_release.py', 'scripts/*typed_sdk*', '.github/workflows/*pypi*.yml']
  push:
    branches: [main]
    paths: ['scripts/**publish_pypi_release.py', 'scripts/*typed_sdk*', '.github/workflows/*pypi*.yml']
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  publisher-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise cold publisher and consumer cohort controls
        env:
          PYTHONPATH: scripts
        run: python -m unittest test_publish_pypi_release test_typed_sdk_cohort test_typed_sdk_registry_workflow -v
