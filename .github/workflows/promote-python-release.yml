name: Promote tested Python release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original completed first-attempt release run
        required: true
        type: string
      tag:
        description: Exact immutable release tag
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: python-release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          path: automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original immutable source and all completed gates
        id: verify
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check-python-release-promotion.py "$SOURCE_RUN" "$RELEASE_TAG" "$RUNNER_TEMP/truss-release-promotion.json" --packages "$RUNNER_TEMP/truss-tested-packages"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ steps.verify.outputs.commit }}
          fetch-depth: 0
          path: source
      - name: Stage checksum-verified original wheel and sdist
        run: |
          mkdir source/dist
          cp "$RUNNER_TEMP"/truss-tested-packages/* source/dist/
      - name: Publish exact tested artifacts
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          python - <<'PYTHON'
          import ast,hashlib,json,os,pathlib,tomllib
          project=tomllib.load(open('packages/python/pyproject.toml','rb'))['project']
          backend=next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('packages/python/src/truss/_query_runtime.py').read_text()).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='BACKEND' for t in n.targets))
          root=pathlib.Path('dist');assets=sorted(root.iterdir());assert len(assets)==2
          assert len(list(root.glob('*.whl')))==len(list(root.glob('*.tar.gz')))==1
          (root/'catalog-rebind-report-v0.2.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.2.md').read_bytes())
          (root/'catalog-rebind-report-v0.4.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-rebind-report-v0.4.md').read_bytes())
          (root/'catalog-source-reference-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-source-reference-v0.1.md').read_bytes())
          manifest=pathlib.Path('packages/python/src/truss/_catalog_runtime/manifest.json');runtime=json.loads(manifest.read_bytes())
          pins={'tag':os.environ['RELEASE_TAG'],'commit':os.environ['RELEASE_COMMIT'],'distribution':'truss-toolkit','version':project['version'],'runtime':runtime['releaseId'],'runtimeManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'layout':runtime['layoutProfile'],'weftRelease':'v'+project['optional-dependencies']['query'][0].removeprefix('weft-sql=='),'weftBackend':backend['backendVersion'],'pgserver':'pgserver-pg18==18.6.1','pgserverRelease':'pg18.6-pgv0.8.6-r2','psycopg':'3.3.6','bun':'1.4.2','nativePlatforms':['linux-x86_64','macos-arm64']}
          profile=pathlib.Path('packages/python/src/truss/_profiles/fresh-catalog-support-declarative08.json')
          policy=json.loads(profile.read_bytes())
          pins.update(timestampComparisonProfile='umf-rfc3339-exact-instant/1.0.0',umfExactInstantCommit='cbb6fb87',umf08CatalogSupport={'identity':policy['identity'],'version':policy['version'],'sha256':hashlib.sha256(profile.read_bytes()).hexdigest()},umf08CatalogReportInterface='truss-catalog-registration-report/0.2',catalogSourceReferenceFormat='truss-catalog-source-reference/0.1',catalogRebindReportInterface='truss-catalog-registration-report/0.3',catalogRebindProfile='truss-native-catalog-rebind/0.4',catalogRebindSupportedProfiles=['truss-native-catalog-rebind/0.1','truss-native-catalog-rebind/0.2','truss-native-catalog-rebind/0.3','truss-native-catalog-rebind/0.4'])
          (root/'catalog-key-backfill-report-v0.1.md').write_bytes(pathlib.Path('docs/helix/02-design/contracts/catalog-key-backfill-report-v0.1.md').read_bytes())
          pins.update(catalogKeyBackfillReportInterface='truss-catalog-registration-report/0.4',catalogKeyBackfillProfile='truss-catalog-key-backfill/0.2',catalogKeyBackfillSupportedProfiles=['truss-catalog-key-backfill/0.1','truss-catalog-key-backfill/0.2'])
          pins.update(currentQueryProfile='truss-current-query-protection/0.1-candidate',currentQueryResultAbi='weft.postgresql.current-values/0.2-candidate',currentQueryMode='explicitly-activated-read-only',currentQueryPlatforms=['linux-x86_64','macos-arm64'],currentQueryWeftSource='cc943a2f0ad87e3742cccdc171184bad7d4dbf60')
          (root/'release-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          (root/'promotion-provenance.json').write_bytes((pathlib.Path(os.environ['RUNNER_TEMP'])/'truss-release-promotion.json').read_bytes())
          assets=sorted(root.iterdir())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PYTHON
          if gh release view "$RELEASE_TAG" --json isDraft,assets > /tmp/release-draft.json; then
            python - <<'PYDRAFT'
          import json,pathlib
          release=json.loads(pathlib.Path('/tmp/release-draft.json').read_text())
          assert release['isDraft'] is True,'Published releases cannot be overwritten'
          expected={p.name for p in pathlib.Path('dist').iterdir()}
          assert {a['name'] for a in release['assets']}<=expected,'Unexpected draft assets refuse promotion'
          PYDRAFT
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Truss ${RELEASE_TAG}" --notes-file "docs/helix/04-build/releases/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
