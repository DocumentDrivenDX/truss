name: Publish Truss Python release to PyPI
on:
  workflow_run:
    workflows: ["Release Python package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing qualified release tag
        required: true
        type: string
      source_sha:
        description: Exact commit targeted by the immutable release tag
        required: true
        type: string
      expected_sums_sha256:
        description: SHA-256 of the public release SHA256SUMS file
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pypi-publish-truss-${{ github.event.workflow_run.head_sha || inputs.source_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      distribution: ${{ steps.identity.outputs.distribution }}
      query_distribution: ${{ steps.identity.outputs.query_distribution }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the release publisher validator
        run: python -m unittest scripts.test_publish_pypi_release -v
      - name: Bind exact tag, source and optional backfill pins
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          MANUAL_SUMS_SHA256: ${{ inputs.expected_sums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MANUAL_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            SUMS_SHA256="$MANUAL_SUMS_SHA256"
          else
            SUMS_SHA256=""
          fi
          VERSION="${TARGET_TAG#v}"
          read -r DISTRIBUTION WHEEL_PREFIX QUERY_DISTRIBUTION < <(python - "$VERSION" <<'PY'
          import sys
          from scripts.publish_pypi_release import distribution_for_version,wheel_prefix_for_version,query_distribution_for_version
          version=sys.argv[1]
          print(distribution_for_version(version),wheel_prefix_for_version(version),query_distribution_for_version(version))
          PY
          )
          printf 'tag=%s\nsource_sha=%s\nsums_sha256=%s\nversion=%s\ndistribution=%s\nwheel_prefix=%s\nquery_distribution=%s\n' \
            "$TARGET_TAG" "$SOURCE_SHA" "$SUMS_SHA256" "$VERSION" "$DISTRIBUTION" "$WHEEL_PREFIX" "$QUERY_DISTRIBUTION" >> "$GITHUB_OUTPUT"
      - name: Read the immutable public release and tag objects
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > incoming/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > incoming/tag-ref.json
          if [[ "$(jq -r .object.type incoming/tag-ref.json)" == tag ]]; then
            OBJECT_SHA="$(jq -r .object.sha incoming/tag-ref.json)"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" > incoming/tag-object.json
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > incoming/producer-run.json
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming/assets
      - name: Verify tag source, checksum manifest, pins and package metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          VERSION: ${{ steps.identity.outputs.version }}
          DISTRIBUTION: ${{ steps.identity.outputs.distribution }}
          WHEEL_PREFIX: ${{ steps.identity.outputs.wheel_prefix }}
          EXPECTED_SUMS_SHA256: ${{ steps.identity.outputs.sums_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_SUMS_SHA256" ]]; then
            EXPECTED_SUMS_SHA256="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .digest | sub("^sha256:"; "")' incoming/release.json)"
          fi
          test "${#EXPECTED_SUMS_SHA256}" = 64
          ARGS=(prepare --repository "$GITHUB_REPOSITORY" --tag "$TAG" --source-sha "$SOURCE_SHA"
            --expected-sums-sha256 "$EXPECTED_SUMS_SHA256" --distribution "$DISTRIBUTION"
            --wheel-prefix "$WHEEL_PREFIX" --wheel-count 1 --require-sdist
            --release-json incoming/release.json --tag-ref-json incoming/tag-ref.json
            --assets-dir incoming/assets --output-dir dist --receipt dist/source-receipt.json)
          if [[ -f incoming/tag-object.json ]]; then ARGS+=(--tag-object-json incoming/tag-object.json); fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            ARGS+=(--producer-run-json incoming/producer-run.json --producer-workflow-path .github/workflows/release.yml)
          fi
          python scripts/publish_pypi_release.py "${ARGS[@]}"
          printf 'version=%s\ndistribution=%s\n' "$VERSION" "$DISTRIBUTION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: truss-pypi-release-${{ steps.identity.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: truss-pypi-release-${{ needs.verify-release.outputs.version }}
          path: dist
      - name: Refuse PyPI collisions and require exact archive bytes
        id: preflight
        run: python scripts/publish_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist
      - name: Publish only the verified archives through PyPI OIDC
        if: steps.preflight.outputs.status == 'absent'
        run: |
          mkdir .verified-pypi-packages
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          receipt=json.loads(Path('dist/source-receipt.json').read_text())
          for name in receipt['files']:
              source=Path('dist',name)
              if not source.is_file() or source.is_symlink(): raise SystemExit('verified archive is missing or unsafe')
              shutil.copyfile(source,Path('.verified-pypi-packages',name))
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        id: pypi-upload
        if: steps.preflight.outputs.status == 'absent'
        with:
          packages-dir: .verified-pypi-packages/
      - name: Verify PyPI-served bytes after publication
        id: postflight
        run: python scripts/publish_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist --wait --timeout 300
      - name: Record exact PyPI publication result
        env:
          UPLOAD_OUTCOME: ${{ steps.pypi-upload.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path("dist/source-receipt.json").read_text(encoding="utf-8"))
          record = {
              "schema": "pypi-publication-receipt.v1",
              "status": "passed",
              "registry": "pypi",
              "tag": source["tag"],
              "source_sha": source["source_sha"],
              "distribution": source["distribution"],
              "version": source["version"],
              "files": source["files"],
              "publication_mode": "oidc_upload" if os.environ["UPLOAD_OUTCOME"] == "success" else "existing_exact_bytes",
              "oidc_trusted_publisher": os.environ["UPLOAD_OUTCOME"] == "success",
              "registry_bytes_verified": True,
          }
          Path("dist/publication-receipt.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: truss-pypi-publication-${{ needs.verify-release.outputs.version }}
          path: dist/*receipt.json
          if-no-files-found: error
          retention-days: 365

  installed-consumer:
    needs: [verify-release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the published Truss query extra from PyPI only
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          TRUSS_DISTRIBUTION: ${{ needs.verify-release.outputs.distribution }}
          WEFT_DISTRIBUTION: ${{ needs.verify-release.outputs.query_distribution }}
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: ''
          PIP_EXTRA_INDEX_URL: ''
          PIP_FIND_LINKS: ''
          PIP_NO_INDEX: ''
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple \
            --report "$RUNNER_TEMP/pip-install-report.json" "${TRUSS_DISTRIBUTION}[query]==$VERSION"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-consumer/bin/python" - <<'PY'
          import importlib.metadata, json, os
          from pathlib import Path
          import truss
          import weft
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "pip-install-report.json").read_text(encoding="utf-8"))
          for item in report["install"]:
              url = item["download_info"]["url"]
              assert url.startswith("https://files.pythonhosted.org/"), url
          record = {
              "schema": "pypi-consumer-receipt.v1",
              "status": "passed",
              "index": "https://pypi.org/simple",
              "truss_distribution": os.environ["TRUSS_DISTRIBUTION"],
              "weft_distribution": os.environ["WEFT_DISTRIBUTION"],
              "truss_version": importlib.metadata.version(os.environ["TRUSS_DISTRIBUTION"]),
              "weft_version": importlib.metadata.version(os.environ["WEFT_DISTRIBUTION"]),
          }
          assert record["truss_version"] == os.environ["VERSION"]
          assert record["weft_version"] == weft.__version__
          assert f'{record["weft_distribution"]}=={record["weft_version"]}' in [item.partition(";")[0].strip() for item in importlib.metadata.requires(record["truss_distribution"])]
          Path(os.environ["RUNNER_TEMP"], "consumer-receipt.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("fresh PyPI Truss query consumer imported Truss and Weft")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: truss-pypi-consumer-${{ needs.verify-release.outputs.version }}
          path: ${{ runner.temp }}/consumer-receipt.json
          if-no-files-found: error
          retention-days: 365
