baseURL: https://documentdrivendx.github.io/truss/
title: Truss
locale: en-US
enableRobotsTXT: true
enableGitInfo: false
disableKinds: [taxonomy, term, RSS]
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
params:
  # Stamped from packages/python/pyproject.toml by pages.yml (HUGO_PARAMS_version).
  version: dev
module:
  mounts:
    - {source: content, target: content}
    - {source: assets, target: assets}
    - {source: layouts, target: layouts}
    - {source: static, target: static}
