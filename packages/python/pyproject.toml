[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truss-toolkit"
version = "0.0.1.dev0"
description = "Experimental Truss Python embedding components"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
truss-local-postgres = "truss.cli:main"

[project.optional-dependencies]
local = ["pgserver==0.1.4", "fasteners==0.20", "platformdirs==4.12.4", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truss = ["py.typed"]
