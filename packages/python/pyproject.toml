[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truss-toolkit"
version = "0.0.1"
description = "Experimental Truss Python embedding components"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0"]

[project.scripts]
truss-local-postgres = "truss.cli:main"

[project.optional-dependencies]
native = ["psycopg[binary]==3.3.6"]
query = ["weft-sql==0.4.3"]
experimental-pg8000 = ["pg8000==1.31.5"]
local = ["pgserver-pg18==18.6.1", "fasteners==0.20", "platformdirs==4.12.4", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truss = ["_umf_core08/*.js", "_umf_core08/*.mjs", "_umf_core08/*.json", "_umf_core08/licenses/*.txt", "_source_census/*.sql", "_security_bootstrap/*.sql", "_umf_keys08/*.js", "_umf_keys08/*.mjs", "_umf_keys08/*.json", "_umf_keys08/licenses/*", "_umf_keys/*.js", "_umf_keys/*.mjs", "_umf_keys/*.json", "_umf_keys/licenses/*.txt", "_catalog_runtime/*.sql", "_catalog_runtime/*.json", "_report_schemas/*.json", "_installation/manifest.json", "_installation/sources.zip", "_installation/statements.json", "_installation/definitions.json", "_installation/definitions.sql", "py.typed", "_profiles/*.json", "_inventory_sql/*.sql", "_inventory_sql/manifest.json", "_umf/manifest.json", "_umf/licenses/*.txt", "_umf/owner/*", "_umf/owners/*/producer.js", "_umf/owners/*/producer-manifest.json", "_umf/runtime/package.json", "_umf/runtime/node_modules/ajv/dist/2020.js", "_umf/packages/umf-bun/src/bridge.js", "_umf/docs/helix/02-design/contracts/*.json"]
